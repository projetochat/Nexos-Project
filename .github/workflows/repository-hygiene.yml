name: Repository hygiene

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject logs, dumps, secrets and oversized artifacts
        run: node scripts/check-repository-hygiene.mjs --tracked
