name: Build Trixus production images

# Build and package only. This workflow does not connect to the VPS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trixus-production-build
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trixus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trixus_1200
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trixus -d trixus_1200"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://trixus:ci-only-password@127.0.0.1:5432/trixus_1200?schema=public
      TRIXUS_TEST_DATABASE_URL: postgresql://trixus:ci-only-password@127.0.0.1:5432/trixus_1200?schema=public
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd backend prisma:generate
      - name: Validate Compose without production credentials
        env:
          TRIXUS_ENV_FILE: .env.vps.example
        run: docker compose --env-file .env.vps.example -f docker-compose.vps.yml config --quiet
      - name: Run project verification with disposable databases
        run: bun run verify

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      VITE_TRIXUS_API_URL: ${{ vars.VITE_TRIXUS_API_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build immutable images for the VPS architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VITE_TRIXUS_API_URL:?Set the production Environment variable VITE_TRIXUS_API_URL}"
          [[ "$VITE_TRIXUS_API_URL" == https://* ]]
          docker build --platform linux/amd64 -f backend/Dockerfile \
            --target runtime -t "trixus-release/backend:$GITHUB_SHA" .
          docker build --platform linux/amd64 -f backend/Dockerfile \
            --target migrate -t "trixus-release/migrate:$GITHUB_SHA" .
          docker build --platform linux/amd64 -f Dockerfile.frontend \
            --build-arg VITE_TRIXUS_API_URL \
            --build-arg VITE_APP_MODE=production \
            --build-arg VITE_SUPABASE_URL \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY \
            --build-arg VITE_SUPABASE_PROJECT_ID \
            -t "trixus-release/frontend:$GITHUB_SHA" .
      - name: Check executable and application files in images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh "trixus-release/backend:$GITHUB_SHA" \
            -c 'command -v node && test -s /app/backend/dist/src/main.js'
          docker run --rm --entrypoint bun "trixus-release/migrate:$GITHUB_SHA" \
            run prisma:migrate:deploy --help
          docker run --rm --entrypoint sh "trixus-release/frontend:$GITHUB_SHA" \
            -c 'command -v bun && test -s /app/.output/server/index.mjs'
      - name: Package images and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir release
          docker image inspect \
            "trixus-release/backend:$GITHUB_SHA" \
            "trixus-release/migrate:$GITHUB_SHA" \
            "trixus-release/frontend:$GITHUB_SHA" \
            --format '{{.Id}} {{json .RepoTags}}' > release/images.txt
          docker save \
            "trixus-release/backend:$GITHUB_SHA" \
            "trixus-release/migrate:$GITHUB_SHA" \
            "trixus-release/frontend:$GITHUB_SHA" | gzip -1 > release/images.tar.gz
          printf '%s\n' "$GITHUB_SHA" > release/commit.txt
          cd release
          sha256sum images.tar.gz images.txt commit.txt > SHA256SUMS
          {
            echo '### Production images packaged — deployment disabled'
            echo "Commit: $GITHUB_SHA"
            echo "Compressed image archive: $(du -h images.tar.gz | cut -f1)"
            echo 'Tests and migrations ran only against disposable GitHub runner services.'
            echo 'No SSH connection, VPS changes, or production migrations were performed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trixus-linux-amd64-${{ github.sha }}
          path: release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
