services:
  postgres:
    image: postgres:16-alpine
    container_name: nexos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexos
      POSTGRES_USER: nexos
      POSTGRES_PASSWORD: nexos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexos -d nexos"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
