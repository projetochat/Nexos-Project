name: ${COMPOSE_PROJECT_NAME:-trixus-vps}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.vps}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.vps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
    volumes:
      - trixus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - trixus-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DATABASE:-evolution_db}
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USERNAME:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?Set EVOLUTION_POSTGRES_PASSWORD in .env.vps}
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution-redis-data:/data

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:?Set EVOLUTION_SERVER_URL in .env.vps}
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Set EVOLUTION_API_KEY in .env.vps}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USERNAME:-evolution}:${EVOLUTION_POSTGRES_PASSWORD:?Set EVOLUTION_POSTGRES_PASSWORD in .env.vps}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DATABASE:-evolution_db}?schema=evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution-instances:/evolution/instances

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      # Defaults to the real, ignored VPS file. TRIXUS_ENV_FILE lets CI validate
      # this Compose file against the tracked example without creating secrets.
      - ${TRIXUS_ENV_FILE:-.env.vps}
    environment:
      NODE_ENV: production
      # Keep this as an explicit, URL-encoded connection string in .env.vps.
      # Interpolating POSTGRES_PASSWORD here would break valid passwords with
      # URI-reserved characters such as @, :, / or #.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.vps}
      REDIS_URL: redis://redis:6379
      BACKEND_HOST: 0.0.0.0
      TRIXUS_STORAGE_LOCAL_PATH: /var/lib/trixus/storage/tickets
      TRIXUS_MESSAGE_STORAGE_LOCAL_PATH: /var/lib/trixus/storage/messages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${TRIXUS_STORAGE_HOST_PATH:?Set an absolute VPS storage path}:/var/lib/trixus/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_TRIXUS_API_URL: ${VITE_TRIXUS_API_URL:?Set VITE_TRIXUS_API_URL in .env.vps}
        VITE_APP_MODE: ${VITE_APP_MODE:-production}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:4173"

  migrate:
    profiles: ["release"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    env_file:
      - ${TRIXUS_ENV_FILE:-.env.vps}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.vps}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  trixus-postgres-data:
  trixus-redis-data:
  evolution-postgres-data:
  evolution-redis-data:
  evolution-instances:
